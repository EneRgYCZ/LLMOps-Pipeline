global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "ollama"
    static_configs:
      - targets: ["ollama:11434"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "gpu"
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: "llm"
    static_configs:
      - targets: ["llm-metrics-wrapper:8000"]
