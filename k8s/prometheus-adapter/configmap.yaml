apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: llmops
data:
  config.yaml: |
    # externalRules serve external.metrics.k8s.io — required for HPA type: External.
    # These metrics are not tied to a Kubernetes resource (no namespace/pod mapping).
    externalRules:
    - seriesQuery: 'llm:active_requests:total'
      name:
        as: "llm_active_requests_total"
      metricsQuery: 'max(llm:active_requests:total)'
    - seriesQuery: 'llm:queue_depth_littles_law'
      name:
        as: "llm_queue_depth_littles_law"
      metricsQuery: 'max(llm:queue_depth_littles_law)'
    # rules serve custom.metrics.k8s.io — pod/namespace-scoped metrics.
    rules:
    - seriesQuery: 'llm_active_requests{namespace!="",pod!=""}'
      seriesFilters: []
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "llm_active_requests"
        as: "llm_active_requests_per_pod"
      metricsQuery: 'avg_over_time(llm_active_requests{<<.LabelMatchers>>}[1m])'
