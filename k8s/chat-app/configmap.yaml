apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-app-config
  namespace: llmops
data:
  OLLAMA_HOST: "http://ollama:11434"
  OLLAMA_MODEL: "ministral-3:8b-instruct-2512-q4_K_M"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector:4318/v1/metrics"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_SERVICE_NAME: "llmops-chat"
  OTEL_DEPLOYMENT_ENVIRONMENT: "kubernetes"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  RAG_ENABLED: "true"
  CHROMA_HOST: "chromadb"
  CHROMA_PORT: "8000"
  EVAL_ENABLED: "true"
  EVAL_DB_PATH: "/data/evaluations.db"
  EVAL_EMBEDDING_MODEL: "nomic-embed-text"
  EVAL_SAMPLE_RATE: "1.0"
  EVAL_QUEUE_MAX_SIZE: "100"
  EVAL_TIMEOUT_SECONDS: "300.0"
  EVAL_FAITHFULNESS_HALLUCINATION_THRESHOLD: "0.5"
