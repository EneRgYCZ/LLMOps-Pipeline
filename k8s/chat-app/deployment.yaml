apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chat-app
  namespace: llmops
  labels:
    app: chat-app
spec:
  replicas: 2
  serviceName: chat-app-headless
  selector:
    matchLabels:
      app: chat-app
  template:
    metadata:
      labels:
        app: chat-app
      annotations:
        # Prometheus scrapes per-pod Prometheus metrics exposed by llm_wrapper.py.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: chat-app
          # Build and push this image from docker/Dockerfile before deploying.
          # Example: docker build -f docker/Dockerfile -t <registry>/llmops-chat:latest .
          image: llmops-chat:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: chat-app-config
          volumeMounts:
            - name: eval-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1"
  # Each replica gets its own PVC. Databases are independent per pod;
  # cross-replica aggregation is performed at analysis time.
  volumeClaimTemplates:
    - metadata:
        name: eval-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
