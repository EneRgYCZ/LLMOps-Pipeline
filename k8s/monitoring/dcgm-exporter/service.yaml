apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: llmops
  labels:
    app: dcgm-exporter
spec:
  selector:
    app: dcgm-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: 9400
  type: ClusterIP
  clusterIP: None  # headless — Prometheus resolves each DaemonSet pod individually
