apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: llmops
  labels:
    app: node-exporter
spec:
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
  type: ClusterIP
  clusterIP: None  # headless — Prometheus resolves individual pod IPs for per-node metrics
