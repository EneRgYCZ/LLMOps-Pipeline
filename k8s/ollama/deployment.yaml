apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llmops
  labels:
    app: ollama
    app.kubernetes.io/part-of: llmops-pipeline
spec:
  # HPA manages replica count at runtime; this is the initial value.
  replicas: 2
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
      annotations:
        # Ollama does not expose a Prometheus endpoint; metrics come from the OTel collector.
        prometheus.io/scrape: "false"
    spec:
${OLLAMA_RUNTIME_CLASS}
      # Spread replicas across nodes for fault isolation.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ollama

      initContainers:
        # Pull the model into the shared PVC before the server starts accepting traffic.
        # On subsequent pod starts the model is already cached; the pull is a no-op.
        - name: model-pull
          image: ollama/ollama:latest
          command:
            - /bin/sh
            - -c
            - |
              ollama serve &
              SERVE_PID=$!
              until curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; do
                sleep 2
              done
              ollama pull "${OLLAMA_MODEL}"
              kill $SERVE_PID
          env:
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: OLLAMA_MODEL
${OLLAMA_NVIDIA_ENV_ENTRY}
          resources:
${OLLAMA_INIT_RESOURCES}
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama

      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - name: api
              containerPort: 11434
          env:
${OLLAMA_NVIDIA_ENV_ENTRY}
            - name: OLLAMA_HOST
              value: "0.0.0.0"
          resources:
${OLLAMA_MAIN_RESOURCES}
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/tags
              port: 11434
            # GPU: 60 × 10s = 10 min; CPU: 120 × 10s = 20 min
            failureThreshold: ${OLLAMA_STARTUP_FAILURE_THRESHOLD}
            periodSeconds: 10

      volumes:
        - name: ollama-models
${OLLAMA_VOLUME}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-config
  namespace: llmops
data:
  OLLAMA_MODEL: "${OLLAMA_MODEL}"
